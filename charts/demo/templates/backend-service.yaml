apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.fullname" . }}-backend
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
