apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.fullname" . }}-postgres
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
